# TrialBench classification benchmark configuration.
# The runner iterates the cross-product of tasks × phases × methods × seeds.

data_root: data          # where TrialBench task folders live (see src/data/download.py)
results_dir: results

# --- The five classification tasks (see PLAN.md §1) ---
tasks:
  - outcome                 # trial approval / outcome           (binary)
  - mortality_rate_yn       # all-cause mortality event          (binary)
  - serious_adverse_rate_yn # serious adverse event              (binary)
  - patient_dropout_rate_yn # patient dropout event              (binary)
  - failure_reason          # trial failure-reason id            (multiclass)

phases:
  - Phase1
  - Phase2
  - Phase3
  - Phase4
  # - All                   # optional pooled phase

# --- Methods to run. Names must be registered in src/methods/registry.py ---
# Tier A (core, CPU) is enabled by default. Uncomment others as deps are installed.
methods:
  # Tier A — classical / linear
  - majority
  - logreg_l2
  - logreg_l1
  - random_forest
  - extra_trees
  - hist_gbm
  - knn
  - svm_linear
  # Tier A — gradient boosting (needs xgboost/lightgbm/catboost)
  - xgboost
  - lightgbm
  - catboost
  # Tier A — text-only
  - tfidf_logreg
  # Tier B — deep tabular (needs torch; `deploy/bootstrap_ec2.sh --extended`
  # or `pip install -r requirements-extended.txt` after installing the CPU
  # torch wheel -- see that file). Without the deps installed these are
  # recorded as "skipped", not an error, so it's safe to leave enabled.
  - tabpfn      # also needs a one-time free license token, see deploy/README.md
  - tabnet
  - ft_transformer
  # Tier C — clinical embeddings (needs torch + transformers; downloads
  # emilyalsentzer/Bio_ClinicalBERT on first use, ~410MB, cached by HF after
  # that). No license gate, unlike tabpfn. Same graceful-skip-if-missing-deps
  # behavior as Tier B.
  - clinical_embeddings
  # Tier D — multimodal / LLM / repo baseline (stubs)
  # - fingerprint_fusion
  # - hint_reference
  # - llm_fewshot

seeds: [42]                 # add more for multi-seed variance, e.g. [42, 7, 123]

# Per-fit parallelism cap (random_forest/extra_trees/knn's n_jobs,
# xgboost/lightgbm's n_jobs, catboost's thread_count). -1 = claim every core,
# fine for one solo sweep. Override with --n-jobs when running several sweeps
# concurrently (deploy/run_codes_sweep.sh does this for you) so they don't all
# claim the same machine at once (wave1-preflight-review.md H2).
n_jobs: -1

bootstrap:
  n_resamples: 1000         # repo default is 20; raise for stable CIs
  ci: 0.95

# Cap rows per task for quick dry-runs (null = use all data)
max_train_rows: null
max_test_rows: null
